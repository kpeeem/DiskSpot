name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Toolchain
        run: xcodebuild -version && swift --version && brew install xcodegen

      - name: Build
        run: ./build.sh Release && ./build-mcp.sh

      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF == refs/tags/* ]] || version=$(git rev-parse --short HEAD)
          ditto -c -k --keepParent build/DiskSpot.app "DiskSpot-$version.zip"
          ditto -c -k build/diskspotmcp "diskspotmcp-$version-arm64.zip"
          shasum -a 256 *.zip | tee SHA256SUMS.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: '*.zip'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diskspot
          path: |
            *.zip
            SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --title "DiskSpot $GITHUB_REF_NAME" --generate-notes
