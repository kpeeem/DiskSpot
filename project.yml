name: DiskSpot
options:
  bundleIdPrefix: dev.kpeeem
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  DiskSpot:
    type: application
    platform: macOS
    sources: [DiskSpot]
    info:
      path: DiskSpot/Info.plist
      properties:
        CFBundleName: DiskSpot
        CFBundleDisplayName: DiskSpot
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ru
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: DiskSpot просит Finder переместить в Корзину файлы, принадлежащие системе, и очистить Корзину.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kpeeem.DiskSpot
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
